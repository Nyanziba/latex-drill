name: Build and deploy LaTeX Drill website

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/pages.yml"
      - "site/**"
      - "README.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install TeX Live tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            texlive-extra-utils \
            texlive-luatex

      - name: Prepare LaTeX build directory
        run: |
          mkdir -p .build/site _site
          cp site/index.tex site/site.cfg site/site.css .build/site/

      - name: Convert LaTeX source to HTML5
        working-directory: .build/site
        run: make4ht -l -f html5 -c site.cfg -d ../../_site index.tex

      - name: Check generated site files
        run: test -s _site/index.html && test -s _site/site.css

      - name: Upload website artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
